{% extends "mywebapp/base.html" %}
{% block content %}
<section class="max-w-2xl mx-auto w-full px-4 sm:px-6 py-8 sm:py-12">
  <a href="{% url 'admin_recommendation_list' %}" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-sky-600 transition font-medium mb-4">
    ← กลับรายการคำแนะนำ
  </a>

  <div class="bg-white rounded-2xl border-2 border-slate-200 p-6 shadow-sm">
    <div class="flex items-center gap-2 mb-6">
      {% if rec.result_type == "STROKE" %}
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-bold bg-rose-500 text-white">⚠️ Stroke</span>
      {% else %}
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-bold bg-emerald-500 text-white">✓ Non-Stroke</span>
      {% endif %}
      <h1 class="font-bold text-xl text-slate-800">แก้ไขคำแนะนำ</h1>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold text-slate-500 tracking-wider uppercase mb-1.5">เนื้อหาคำแนะนำ</label>
        {{ form.content }}
      </div>
      <button type="submit" class="w-full bg-sky-600 text-white py-3 rounded-xl text-sm font-semibold hover:bg-sky-700 transition shadow-md shadow-sky-100">
        บันทึกการแก้ไข
      </button>
    </form>
  </div>
</section>
<style>
  textarea.form-input { resize: vertical; line-height: 1.6; }
</style>
{% endblock %}
