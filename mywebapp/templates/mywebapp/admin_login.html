{% extends "mywebapp/base.html" %}
{% block content %}
<section class="max-w-md mx-auto w-full px-4 sm:px-6 py-10 sm:py-14">
  <div class="bg-white rounded-2xl border-2 border-slate-800 p-6 sm:p-8 shadow-sm">
    <div class="flex items-center gap-2 mb-1">
      <span class="text-2xl">🛠️</span>
      <h1 class="font-bold text-2xl text-slate-800">ผู้ดูแลระบบ</h1>
    </div>
    <p class="text-sm text-slate-400 mb-6">สำหรับผู้ดูแลระบบเท่านั้น</p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold text-slate-500 tracking-wider mb-1.5">ชื่อผู้ใช้</label>
        <input type="text" name="username" class="form-input" required autofocus>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 tracking-wider mb-1.5">รหัสผ่าน</label>
        <input type="password" name="password" class="form-input" required>
      </div>
      <button type="submit" class="w-full bg-slate-800 text-white py-3 rounded-xl text-sm font-semibold hover:bg-slate-900 transition shadow-md shadow-slate-200 mt-2">
        เข้าสู่ระบบผู้ดูแลระบบ
      </button>
    </form>

    <a href="{% url 'index' %}" class="block text-center text-xs text-slate-400 hover:text-sky-600 mt-6 transition">
      ← กลับหน้าหลัก
    </a>
  </div>
</section>
{% endblock %}
